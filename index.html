<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>趣味滑块解锁</title>
<style>
  :root{
    /* 橡木（默认主题） */
    --frame1:#a67c4a; --frame2:#7d5a2e; --frame3:#5f421f;
    --tray1:#e6cba0; --tray2:#d4b482;
    --groove:rgba(90,60,25,.22);
    --b1L:#d9a86a; --b1D:#b07f3e;
    --b2L:#c9925a; --b2D:#a3702f;
    --b3L:#e0b478; --b3D:#b98543;
    --b4L:#cf9c60; --b4D:#a97a36;
    --tgL:#c04632; --tgD:#8e2a1c;
    --ink:#3f2d16;
    --grain-h:none; --grain-v:none; --grain-f:none;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(120% 100% at 50% 0%,#f2ede4 0%,#e6ded0 55%,#d8cfbe 100%);
    color:var(--ink);display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
    overscroll-behavior:none;
  }
  .app{
    position:relative;z-index:1;width:100%;max-width:470px;height:100dvh;max-height:900px;
    display:flex;flex-direction:column;align-items:center;
    padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));
    gap:12px;
  }
  /* 顶部标题栏 */
  .topbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:9px}
  .logo{
    width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    background:var(--grain-f),linear-gradient(145deg,var(--b3L),var(--b3D));
    box-shadow:inset 0 1px 2px rgba(255,255,255,.5),inset 0 -2px 3px rgba(0,0,0,.2),0 3px 7px rgba(60,38,10,.3);
    border:1px solid rgba(90,60,20,.4);
  }
  .logo b{color:#fff5df;font-size:17px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
  h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.5px;color:#4a3212}
  .top-actions{display:flex;gap:7px}
  .icon-btn{
    width:38px;height:38px;border:none;border-radius:11px;cursor:pointer;
    background:linear-gradient(160deg,#fffdf8,#efe5d2);
    border:1px solid rgba(120,85,40,.25);box-shadow:0 2px 5px rgba(70,45,15,.15);
    font-size:17px;display:flex;align-items:center;justify-content:center;color:#5b3f1c;
    transition:transform .12s,filter .12s;
  }
  .icon-btn:active{transform:scale(.92)}
  .icon-btn.off{filter:grayscale(1) opacity(.6)}
  /* 信息条 */
  .hud{
    width:100%;display:flex;align-items:center;gap:8px;
    background:rgba(255,253,246,.75);border:1px solid rgba(130,95,50,.2);
    border-radius:14px;padding:9px 12px;box-shadow:0 2px 8px rgba(70,45,15,.08);
  }
  .lv-nav{display:flex;align-items:center;gap:4px}
  .nav-btn{
    width:30px;height:30px;border:none;border-radius:9px;cursor:pointer;font-size:14px;
    background:var(--grain-f),linear-gradient(160deg,var(--frame1),var(--frame2));color:#fff4e2;
    box-shadow:0 2px 4px rgba(60,38,10,.25)}
  .nav-btn:disabled{opacity:.35;cursor:not-allowed}
  .hud-title{flex:1;text-align:center;font-size:14px;font-weight:700;color:#5b3f1c}
  .hud-title span{color:#9c4a12}
  .stat{display:flex;gap:10px;font-size:12px;color:#7a5a30;font-weight:600}
  .stat b{color:#9c4a12;font-size:14px}
  /* 棋盘 */
  .board-card{
    position:relative;width:100%;max-width:430px;flex:1;min-height:0;
    display:flex;align-items:center;justify-content:center;
  }
  .board-frame{
    position:relative;width:100%;aspect-ratio:6/6;max-height:100%;
    border-radius:20px;padding:11px;
    background:var(--grain-f),linear-gradient(150deg,var(--frame1),var(--frame2) 55%,var(--frame3));
    background-size:auto,cover;
    box-shadow:0 12px 28px rgba(50,30,8,.4),inset 0 2px 2px rgba(255,255,255,.3),inset 0 -3px 5px rgba(0,0,0,.25);
    border:2px solid rgba(70,45,15,.55);
  }
  .board{
    position:relative;width:100%;height:100%;border-radius:10px;overflow:hidden;z-index:1;
    background:var(--grain-f),linear-gradient(155deg,var(--tray1),var(--tray2));
    box-shadow:inset 0 3px 10px rgba(50,30,8,.3),inset 0 -1px 2px rgba(255,255,255,.25);
    border:1px solid rgba(70,45,15,.35);
  }
  /* 出口门洞（贴在木框右缘） */
  .exit-door{
    position:absolute;right:-2px;z-index:2;width:15px;pointer-events:none;
    border-radius:0 8px 8px 0;
    background:linear-gradient(90deg,rgba(30,18,6,.55),rgba(30,18,6,.15) 60%,transparent);
    box-shadow:inset 2px 0 4px rgba(0,0,0,.5);
  }
  /* 雕刻网格线 */
  .grid{position:absolute;inset:0;pointer-events:none}
  .grid i{position:absolute;background:var(--groove)}
  .grid i.v{top:0;bottom:0;width:1px;box-shadow:1px 0 0 rgba(255,255,255,.18)}
  .grid i.h{left:0;right:0;height:1px;box-shadow:0 1px 0 rgba(255,255,255,.18)}
  /* 出口引导 */
  .exit-lane{
    position:absolute;right:0;width:calc(100%/6);height:calc(100%/6);
    top:calc(100%/6 * 2);pointer-events:none;z-index:0;
    background:linear-gradient(90deg,rgba(255,240,200,0),rgba(255,236,180,.4));
    display:flex;align-items:center;justify-content:flex-end;
  }
  .exit-lane::after{content:"›";color:rgba(140,70,20,.55);font-size:30px;font-weight:900;padding-right:3px;animation:lanePulse 1.6s ease-in-out infinite}
  @keyframes lanePulse{0%,100%{transform:translateX(0);opacity:.45}50%{transform:translateX(3px);opacity:1}}
  /* 木块 */
  .block{
    position:absolute;z-index:3;touch-action:none;cursor:grab;
    border-radius:8px;transition:none;
    -webkit-touch-callout:none;
    background-image:var(--grain-b),linear-gradient(155deg,var(--bL),var(--bD));
    background-size:180px 180px,cover;
    box-shadow:
      inset 0 2px 2px rgba(255,255,255,.4),
      inset 0 -3px 4px rgba(0,0,0,.28),
      inset 2px 0 3px rgba(255,255,255,.14),
      inset -2px 0 3px rgba(0,0,0,.12),
      0 4px 7px rgba(40,25,10,.35);
    border:1px solid rgba(60,35,10,.45);
    display:flex;align-items:center;justify-content:center;
  }
  .block::after{
    content:"";position:absolute;inset:2px;border-radius:6px;
    background:linear-gradient(160deg,rgba(255,255,255,.16),transparent 45%,rgba(0,0,0,.06));
    pointer-events:none;
  }
  .block.t1{--bL:var(--b1L);--bD:var(--b1D)}
  .block.t2{--bL:var(--b2L);--bD:var(--b2D)}
  .block.t3{--bL:var(--b3L);--bD:var(--b3D)}
  .block.t4{--bL:var(--b4L);--bD:var(--b4D)}
  .block.target{
    --bL:var(--tgL);--bD:var(--tgD);
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.45),
      inset 0 -3px 5px rgba(0,0,0,.35),
      inset 2px 0 3px rgba(255,255,255,.15),
      0 5px 10px rgba(120,30,15,.45);
    border-color:rgba(70,15,5,.6);
  }
  .block.target::before{
    content:"➜";color:#ffd98a;font-size:22px;font-weight:900;
    text-shadow:0 1px 2px rgba(0,0,0,.5),0 0 8px rgba(255,200,90,.5);
  }
  .block.dragging{
    z-index:9;cursor:grabbing;filter:brightness(1.06) saturate(1.05);
    box-shadow:
      inset 0 2px 2px rgba(255,255,255,.4),
      inset 0 -3px 4px rgba(0,0,0,.28),
      0 10px 18px rgba(30,18,6,.5);
  }
  .block.anim{transition:left .15s cubic-bezier(.25,.9,.3,1.15),top .15s cubic-bezier(.25,.9,.3,1.15)}
  .block.anim-t{transition:transform .15s cubic-bezier(.25,.9,.3,1.15)}
  .block.exiting{transition:transform .5s cubic-bezier(.55,0,.85,.4),opacity .45s .05s;opacity:0;z-index:9}
  .block.hintflash{animation:hintFlash .55s ease-in-out 3}
  @keyframes hintFlash{0%,100%{filter:brightness(1)}50%{filter:brightness(1.45)}}
  /* 底部控制 */
  .controls{width:100%;max-width:430px;display:flex;gap:8px}
  .btn{
    flex:1;padding:12px 6px;border:none;border-radius:13px;cursor:pointer;
    font-size:13px;font-weight:700;color:#fff6e8;
    background:var(--grain-f),linear-gradient(160deg,var(--frame1),var(--frame2));
    background-size:auto,cover;
    box-shadow:0 4px 9px rgba(60,38,10,.3),inset 0 1px 1px rgba(255,255,255,.3);
    border:1px solid rgba(80,50,15,.4);transition:transform .12s,filter .12s;
  }
  .btn:active{transform:translateY(2px);box-shadow:0 2px 5px rgba(60,38,10,.3)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:linear-gradient(160deg,#fffdf8,#efe5d2);color:#6b4a22;border-color:rgba(120,85,40,.3)}
  /* 主题面板 */
  .theme-panel{
    position:absolute;left:50%;transform:translateX(-50%) translateY(14px);
    bottom:76px;z-index:20;width:min(360px,calc(100% - 28px));
    background:linear-gradient(160deg,#fffdf6,#f2e8d4);
    border:2px solid rgba(120,85,40,.35);border-radius:18px;padding:14px;
    box-shadow:0 12px 32px rgba(40,25,8,.35);
    opacity:0;visibility:hidden;transition:.2s;
  }
  .theme-panel.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  .theme-panel h3{margin:0 0 11px;font-size:14px;color:#6b4a22;text-align:center}
  .theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .theme-item{border:none;background:none;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px}
  .theme-dot{
    width:46px;height:46px;border-radius:13px;
    background:linear-gradient(145deg,var(--tc1),var(--tc2));
    border:2px solid rgba(90,60,25,.35);box-shadow:0 3px 7px rgba(50,30,8,.25),inset 0 1px 1px rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;
  }
  .theme-item.active .theme-dot::after{content:"✓";position:absolute;inset:0;background:rgba(0,0,0,.32);color:#fff;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
  .theme-item span{font-size:11px;color:#7a5a30}
  /* 弹窗 */
  .mask{
    position:fixed;inset:0;z-index:50;background:rgba(30,18,6,.5);
    display:flex;align-items:center;justify-content:center;padding:20px;
    opacity:0;visibility:hidden;transition:.22s;backdrop-filter:blur(3px);
  }
  .mask.show{opacity:1;visibility:visible}
  .dialog{
    width:min(330px,100%);border-radius:22px;padding:26px 22px 22px;text-align:center;
    background:linear-gradient(160deg,#fffdf4,#f3e6c9);
    border:3px solid var(--frame2);box-shadow:0 18px 45px rgba(30,18,6,.5);
    transform:scale(.86);transition:.25s cubic-bezier(.2,1.4,.4,1);
  }
  .mask.show .dialog{transform:scale(1)}
  .dialog .emoji{font-size:50px;line-height:1;margin-bottom:6px}
  .dialog h2{margin:0 0 6px;font-size:23px;color:#8a4a12}
  .dialog p{margin:0 0 18px;font-size:13px;color:#7a5a30;line-height:1.7}
  .dialog .stars{font-size:26px;letter-spacing:3px;margin-bottom:14px}
  .dialog .row{display:flex;gap:10px}
  .dialog .row .btn{margin:0}
  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);
    background:rgba(40,25,10,.92);color:#fff6e5;padding:10px 18px;border-radius:22px;
    font-size:13px;z-index:60;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 关卡菜单 */
  .lv-menu{max-height:50vh;overflow-y:auto;margin:4px 0 16px;display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
  .lv-cell{
    aspect-ratio:1;border:none;border-radius:9px;cursor:pointer;font-size:12px;font-weight:700;
    background:linear-gradient(160deg,#f4ead4,#e2d0ab);color:#7a5a30;border:1px solid rgba(120,85,40,.25);
    display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;
  }
  .lv-cell small{font-size:8px;letter-spacing:1px;color:#c08430}
  .lv-cell.done{background:linear-gradient(160deg,var(--b3L),var(--b3D));color:#fff}
  .lv-cell.done small{color:#ffe9b0}
  .lv-cell.cur{outline:3px solid #c04a12;outline-offset:1px}
  @media (max-width:380px){
    h1{font-size:15px}.logo{width:36px;height:36px}.icon-btn{width:38px;height:38px}
    .hud{padding:7px 9px;gap:6px}.hud-title{font-size:12px}.stat{gap:6px;font-size:11px}
    .controls .btn{font-size:12px;padding:11px 4px}
  }
  /* 低矮屏幕（横屏/短屏）压缩间距 */
  @media (max-height:620px){
    .app{gap:7px;padding-top:8px;padding-bottom:8px}
    .logo{width:34px;height:34px}.icon-btn{width:34px;height:34px}
    .hud{padding:6px 10px}
    .controls .btn{padding:9px 4px}
  }
  @media (min-height:860px){.app{gap:16px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="logo"><b>锁</b></div>
      <h1>趣味滑块解锁</h1>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="gridsBtn" title="选关">☰</button>
      <button class="icon-btn" id="themeBtn" title="换肤">🎨</button>
      <button class="icon-btn" id="soundBtn" title="音效">🔊</button>
    </div>
  </div>

  <div class="hud">
    <div class="lv-nav">
      <button class="nav-btn" id="prevBtn">‹</button>
      <div class="hud-title">第 <span id="levelNo">1</span> / <span id="levelTotal">24</span> 关</div>
      <button class="nav-btn" id="nextBtn">›</button>
    </div>
    <div class="stat">
      <div>步数 <b id="moveCount">0</b></div>
      <div>最优 <b id="parCount">-</b></div>
      <div>最佳 <b id="bestCount">-</b></div>
    </div>
  </div>

  <div class="board-card">
    <div class="board-frame" id="boardFrame">
      <div class="board" id="board">
        <div class="exit-lane"></div>
        <div class="grid" id="grid"></div>
        <div id="blocks"></div>
      </div>
      <div class="exit-door" id="exitDoor"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn ghost" id="undoBtn">↶ 撤销</button>
    <button class="btn ghost" id="resetBtn">↻ 重置</button>
    <button class="btn" id="hintBtn">✦ 提示</button>
  </div>

  <div class="theme-panel" id="themePanel">
    <h3>选择木质</h3>
    <div class="theme-grid" id="themeGrid"></div>
  </div>
</div>

<div class="mask" id="winMask">
  <div class="dialog">
    <div class="emoji">🎉</div>
    <h2>恭喜过关！</h2>
    <div class="stars" id="winStars">⭐⭐⭐</div>
    <p id="winText">你用了 0 步完成本关</p>
    <div class="row">
      <button class="btn ghost" id="winRetry">再玩一次</button>
      <button class="btn" id="winNext">下一关 ›</button>
    </div>
  </div>
</div>

<div class="mask" id="gridMask">
  <div class="dialog">
    <h2>选择关卡</h2>
    <p>共 24 关，难度循序渐进</p>
    <div class="lv-menu" id="lvMenu"></div>
    <button class="btn" id="gridClose">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== 关卡数据：前 13 关精选自初版，后 11 关由 BFS 生成器产出，最优步数严格递增 ===== */
const LEVELS=[[[1,1,1],[1,2,4],[5,3,1],[3,3,5],[4,4,1],[1,4,3],[2,5,4],[1,6,3]],[[3,1,1],[2,1,2],[3,2,4],[3,2,5],[3,2,6],[5,3,1],[2,4,2]],[[4,1,5],[4,1,6],[1,2,1],[5,3,1],[3,4,1],[3,4,2],[1,5,4],[1,6,4]],[[1,1,2],[1,1,4],[4,1,6],[3,2,5],[5,3,1],[2,4,1],[3,4,5],[2,6,4]],[[3,1,1],[3,1,2],[3,1,4],[4,1,5],[5,3,1],[3,3,4],[1,4,1],[3,5,1],[2,5,2]],[[3,1,1],[4,1,5],[3,1,6],[3,2,4],[5,3,1],[3,3,6],[3,4,1],[4,4,2],[2,6,3]],[[2,1,1],[4,1,4],[1,2,2],[1,2,5],[5,3,1],[3,3,5],[4,3,6],[2,4,2],[1,5,3],[3,5,5]],[[1,1,2],[3,2,3],[2,2,4],[5,3,1],[3,3,5],[4,3,6],[4,4,1],[1,4,2],[1,5,2],[1,5,4]],[[4,1,1],[3,1,2],[1,1,3],[1,1,5],[1,2,3],[1,2,5],[5,3,2],[4,3,4],[3,3,6],[2,5,1],[3,5,6]],[[3,1,2],[1,1,3],[1,1,5],[1,2,3],[3,2,6],[5,3,1],[4,3,4],[4,4,1],[1,4,2],[1,4,5],[2,6,2]],[[2,1,3],[3,1,6],[2,2,1],[4,2,4],[3,2,5],[5,3,1],[3,3,6],[1,4,1],[3,4,5],[3,5,1],[2,5,2],[2,6,2]],[[1,1,2],[1,1,4],[4,2,3],[2,2,4],[5,3,1],[4,3,6],[3,4,1],[3,4,2],[3,4,5],[1,5,3],[1,6,2],[1,6,5]],[[1,1,2],[4,1,5],[3,1,6],[3,2,3],[5,3,1],[3,3,6],[4,4,1],[4,4,2],[1,4,4],[1,5,3],[1,5,5],[1,6,4]],[[5,3,1],[1,4,3],[1,5,4],[1,1,2],[1,6,4],[1,5,1],[3,2,5],[4,1,4],[1,4,1],[3,4,6],[1,1,5],[1,6,1],[3,1,1]],[[5,3,1],[1,1,3],[3,1,2],[2,5,3],[4,2,3],[3,5,1],[3,2,4],[3,3,5],[2,6,2],[3,3,6],[3,1,1]],[[5,3,1],[3,3,3],[3,2,5],[1,5,2],[4,4,6],[2,2,2],[3,3,4],[2,1,2],[1,6,4],[3,4,5],[1,4,1],[3,2,6],[3,5,1]],[[5,3,1],[3,3,5],[3,4,4],[4,4,6],[3,1,4],[1,2,5],[3,2,3],[3,5,1],[1,5,2],[2,1,1],[1,4,2],[3,5,5]],[[5,3,1],[3,3,6],[1,4,1],[2,1,2],[3,4,5],[1,5,2],[3,3,4],[2,2,2],[3,5,1],[3,3,3],[3,5,4],[1,6,2],[3,5,6]],[[5,3,1],[3,4,3],[3,3,5],[1,6,5],[2,2,1],[3,4,1],[3,1,5],[4,2,4],[1,5,5],[1,6,1],[2,1,1]],[[5,3,1],[1,4,5],[3,2,4],[3,3,3],[2,1,2],[4,1,5],[3,4,4],[1,2,1],[4,1,6],[3,4,1],[1,5,2]],[[5,3,1],[2,2,2],[1,4,5],[3,5,2],[3,3,3],[1,1,2],[2,6,3],[4,1,5],[3,1,1],[3,5,6],[1,5,4],[3,2,6],[3,5,1]],[[5,3,1],[1,2,2],[1,1,5],[2,6,1],[1,4,5],[1,5,2],[1,2,5],[3,5,5],[2,1,2],[3,5,6],[4,4,4],[3,3,3],[3,4,1]],[[5,3,1],[4,2,5],[1,4,2],[1,5,3],[2,6,3],[4,4,6],[3,2,4],[2,1,1],[3,2,3],[1,1,4],[3,2,6],[3,5,1]],[[5,3,3],[2,6,3],[3,1,3],[1,5,4],[1,4,1],[4,4,6],[3,2,6],[3,1,2],[3,1,4],[3,3,5],[4,1,1],[1,1,5],[1,6,1],[3,4,3]]];
const PAR=[3,5,5,6,7,7,8,9,9,10,10,11,12,12,14,16,17,19,21,23,25,27,29,37];

/* ===== 木质主题（真实木材色系） ===== */
const THEMES=[
  {id:'oak',   name:'橡木', emoji:'🪵', frame:['#a67c4a','#7d5a2e','#5f421f'], tray:['#e6cba0','#d4b482'],
   blocks:[['#d9a86a','#b07f3e'],['#c9925a','#a3702f'],['#e0b478','#b98543'],['#cf9c60','#a97a36']], target:['#c04632','#8e2a1c']},
  {id:'walnut',name:'胡桃', emoji:'🌰', frame:['#6e4e2e','#503620','#3a2712'], tray:['#c9b08a','#b39a70'],
   blocks:[['#9a7245','#7a5530'],['#8a6538','#6b4a24'],['#a67e4f','#84603a'],['#93703f','#75552b']], target:['#b8402e','#862618']},
  {id:'cherry',name:'樱桃', emoji:'🍒', frame:['#9c5a3c','#75422a','#572f1c'], tray:['#e0b394','#d4a87e'],
   blocks:[['#c47a4e','#9e5a32'],['#b56c42','#905028'],['#d08658','#aa6538'],['#bc7048','#96552c']], target:['#a83226','#7c1f12']},
  {id:'ebony', name:'乌木', emoji:'🖤', frame:['#4a3828','#332619','#241a0f'], tray:['#a89478','#94805f'],
   blocks:[['#7a6248','#5c4732'],['#6d563e','#52402a'],['#866e50','#665238'],['#75604a','#594631']], target:['#c04a34','#902c1a']},
];
const DEF={1:{o:'H',len:2},2:{o:'H',len:3},3:{o:'V',len:2},4:{o:'V',len:3},5:{o:'H',len:2,target:true}};
const N=6;
const $=id=>document.getElementById(id);
const boardEl=$('board'), blocksEl=$('blocks'), frameEl=$('boardFrame'), doorEl=$('exitDoor');

/* ===== 状态 ===== */
let state={level:1, blocks:[], idxs:[], moves:0, history:[], won:false};
let best={}, stars={}, curTheme=0, soundOn=true;

function loadSave(){
  try{
    const s=JSON.parse(localStorage.getItem('slideUnlock.save.v2')||'{}');
    if(s.level) state.level=Math.min(s.level,LEVELS.length);
    if(s.best) best=s.best;
    if(s.stars) stars=s.stars;
    if(typeof s.theme==='number') curTheme=Math.min(s.theme,THEMES.length-1);
    if(typeof s.sound==='boolean') soundOn=s.sound;
  }catch(e){}
}
function save(){
  localStorage.setItem('slideUnlock.save.v2',JSON.stringify({
    level:state.level,best,stars,theme:curTheme,sound:soundOn
  }));
}

/* ===== 木纹理（SVG 湍流噪声，按方向生成） ===== */
function grainURI(dir,seed,op){
  const bf=dir==='h'?'0.85 0.07':dir==='v'?'0.07 0.85':'0.4 0.04';
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='${bf}' numOctaves='4' seed='${seed}'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(#n)' opacity='${op}'/></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
function initGrain(){
  const r=document.documentElement.style;
  r.setProperty('--grain-h',grainURI('h',5,.14));
  r.setProperty('--grain-v',grainURI('v',9,.14));
  r.setProperty('--grain-f',grainURI('f',2,.10));
}

/* ===== 拟真木声（WebAudio 全合成，无音频文件） ===== */
const SFX={
  ctx:null,master:null,noiseBuf:null,slide:null,
  ensure(){
    if(this.ctx){ if(this.ctx.state==='suspended')this.ctx.resume(); return !!this.ctx; }
    try{
      this.ctx=new (window.AudioContext||window.webkitAudioContext)();
      this.master=this.ctx.createGain();
      this.master.gain.value=soundOn?1:0;
      this.master.connect(this.ctx.destination);
      const len=this.ctx.sampleRate;
      this.noiseBuf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
      const d=this.noiseBuf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    }catch(e){}
    return !!this.ctx;
  },
  /* 木块磕碰声：带通噪声瞬态 + 低频木体共振 */
  knock(st,base){
    if(!this.ensure())return;
    st=st||1;base=base||520;
    const c=this.ctx,t=c.currentTime;
    const n=c.createBufferSource();n.buffer=this.noiseBuf;
    n.playbackRate.value=0.9+Math.random()*0.2;
    const bf=c.createBiquadFilter();bf.type='bandpass';
    bf.frequency.value=base*(0.9+Math.random()*0.25);bf.Q.value=8;
    const g=c.createGain();
    g.gain.setValueAtTime(0.85*st,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.075);
    n.connect(bf);bf.connect(g);g.connect(this.master);
    n.start(t);n.stop(t+0.09);
    const o=c.createOscillator();o.type='sine';
    o.frequency.setValueAtTime(175*(0.9+Math.random()*0.2),t);
    o.frequency.exponentialRampToValueAtTime(62,t+0.11);
    const og=c.createGain();
    og.gain.setValueAtTime(0.45*st,t);
    og.gain.exponentialRampToValueAtTime(0.001,t+0.12);
    o.connect(og);og.connect(this.master);
    o.start(t);o.stop(t+0.13);
  },
  thud(){ this.knock(0.7,250); },
  /* 轻触声 */
  tick(){
    if(!this.ensure())return;
    const c=this.ctx,t=c.currentTime;
    const n=c.createBufferSource();n.buffer=this.noiseBuf;
    const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=2600;
    const g=c.createGain();
    g.gain.setValueAtTime(0.16,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.035);
    n.connect(f);f.connect(g);g.connect(this.master);
    n.start(t);n.stop(t+0.045);
  },
  /* 滑动摩擦声：速度越快越响 */
  slideStart(){
    if(!this.ensure())return;
    this.slideStop(true);
    const c=this.ctx;
    const n=c.createBufferSource();n.buffer=this.noiseBuf;n.loop=true;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=380;f.Q.value=1.2;
    const g=c.createGain();g.gain.value=0;
    n.connect(f);f.connect(g);g.connect(this.master);
    n.start();
    this.slide={n,g};
  },
  slideSet(v){
    if(this.slide)this.slide.g.gain.setTargetAtTime(Math.min(0.13,v*0.13),this.ctx.currentTime,0.04);
  },
  slideStop(now){
    if(!this.slide)return;
    const s=this.slide;this.slide=null;
    if(now){ try{s.n.stop()}catch(e){} return; }
    s.g.gain.setTargetAtTime(0,this.ctx.currentTime,0.05);
    setTimeout(()=>{try{s.n.stop()}catch(e){}},200);
  },
  /* 过关：木质木琴琶音 */
  win(){
    if(!this.ensure())return;
    const c=this.ctx,t0=c.currentTime+0.04;
    [523.25,659.25,783.99,1046.5].forEach((fr,i)=>{
      const t=t0+i*0.09;
      const o=c.createOscillator();o.type='triangle';o.frequency.value=fr;
      const o2=c.createOscillator();o2.type='sine';o2.frequency.value=fr*3.02;
      const g=c.createGain();
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.3,t+0.008);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
      const g2=c.createGain();g2.gain.value=0.1;
      o.connect(g);o2.connect(g2);g2.connect(g);g.connect(this.master);
      o.start(t);o.stop(t+0.55);o2.start(t);o2.stop(t+0.18);
    });
    this.knock(0.45,700);
  },
};

/* ===== 主题应用 ===== */
function applyTheme(){
  const t=THEMES[curTheme],r=document.documentElement.style;
  r.setProperty('--frame1',t.frame[0]);r.setProperty('--frame2',t.frame[1]);r.setProperty('--frame3',t.frame[2]);
  r.setProperty('--tray1',t.tray[0]);r.setProperty('--tray2',t.tray[1]);
  t.blocks.forEach((b,i)=>{r.setProperty('--b'+(i+1)+'L',b[0]);r.setProperty('--b'+(i+1)+'D',b[1]);});
  r.setProperty('--tgL',t.target[0]);r.setProperty('--tgD',t.target[1]);
  $('soundBtn').classList.toggle('off',!soundOn);
  $('soundBtn').textContent=soundOn?'🔊':'🔇';
  renderThemeGrid();
}
function renderThemeGrid(){
  const g=$('themeGrid');g.innerHTML='';
  THEMES.forEach((t,i)=>{
    const b=document.createElement('button');
    b.className='theme-item'+(i===curTheme?' active':'');
    b.innerHTML='<div class="theme-dot" style="--tc1:'+t.blocks[2][0]+';--tc2:'+t.target[0]+'">'+t.emoji+'</div><span>'+t.name+'</span>';
    b.onclick=()=>{curTheme=i;applyTheme();save();SFX.tick();toast('已切换：'+t.name)};
    g.appendChild(b);
  });
}

/* ===== 关卡 ===== */
function buildGrid(){
  const g=$('grid');g.innerHTML='';
  for(let i=1;i<N;i++){
    const v=document.createElement('i');v.className='v';v.style.left=(i/N*100)+'%';g.appendChild(v);
    const h=document.createElement('i');h.className='h';h.style.top=(i/N*100)+'%';g.appendChild(h);
  }
}
function parseLevel(arr){
  const blocks=[],idxs=[];
  for(const [t,r,c] of arr){
    blocks.push({t,...DEF[t]});
    idxs.push([r,c]);
  }
  return {blocks,idxs};
}
function loadLevel(n){
  state.level=Math.max(1,Math.min(LEVELS.length,n));
  const parsed=parseLevel(LEVELS[state.level-1]);
  state.blocks=parsed.blocks;
  state.idxs=parsed.idxs;
  state.moves=0;state.history=[];state.won=false;
  save();render();
  $('levelNo').textContent=state.level;
  $('moveCount').textContent='0';
  $('parCount').textContent=PAR[state.level-1]||'-';
  $('bestCount').textContent=best[state.level]||'-';
  $('prevBtn').disabled=state.level<=1;
  $('nextBtn').disabled=state.level>=LEVELS.length;
  $('undoBtn').disabled=true;
}

function cellsOf(b,idx){
  const out=[];
  for(let a=0;a<b.len;a++){
    if(b.o==='H')out.push([idx[0],idx[1]+a]);
    else out.push([idx[0]+a,idx[1]]);
  }
  return out;
}
function occupancy(skip){
  const s=new Set();
  state.blocks.forEach((b,i)=>{
    if(i===skip)return;
    cellsOf(b,state.idxs[i]).forEach(([r,c])=>s.add(r+','+c));
  });
  return s;
}
function rangeOf(i){
  const b=state.blocks[i],idx=state.idxs[i],occ=occupancy(i);
  let min,max;
  if(b.o==='H'){
    min=idx[1];max=idx[1];
    while(min>1&&!occ.has(idx[0]+','+(min-1)))min--;
    while(max+b.len-1<N&&!occ.has(idx[0]+','+(max+b.len)))max++;
  }else{
    min=idx[0];max=idx[0];
    while(min>1&&!occ.has((min-1)+','+idx[1]))min--;
    while(max+b.len-1<N&&!occ.has((max+b.len)+','+idx[1]))max++;
  }
  return {min,max};
}

let nodes=[];
function render(){
  blocksEl.innerHTML='';nodes=[];
  state.blocks.forEach((b,i)=>{
    const el=document.createElement('div');
    el.className='block '+(b.target?'target':'t'+b.t);
    el.dataset.i=i;
    el.style.setProperty('--grain-b',b.o==='H'?'var(--grain-h)':'var(--grain-v)');
    el.style.backgroundPosition=(i*37%120)+'px '+(i*53%120)+'px,0 0';
    blocksEl.appendChild(el);nodes.push(el);
  });
  positionAll();
}
function positionAll(){
  const cs=boardEl.clientWidth/N;
  state.blocks.forEach((b,i)=>{
    const el=nodes[i],idx=state.idxs[i];
    el.style.width=(b.o==='H'?b.len*cs:cs)+'px';
    el.style.height=(b.o==='V'?b.len*cs:cs)+'px';
    el.style.left=((idx[1]-1)*cs)+'px';
    el.style.top=((idx[0]-1)*cs)+'px';
  });
  doorEl.style.top=(boardEl.offsetTop+cs*2)+'px';
  doorEl.style.height=cs+'px';
}
window.addEventListener('resize',positionAll);

/* ===== 交互：顺滑拖拽（1:1 跟手 + 松手吸附） ===== */
let drag=null;
blocksEl.addEventListener('pointerdown',e=>{
  if(state.won)return;
  const el=e.target.closest('.block');if(!el)return;
  const i=+el.dataset.i;
  const b=state.blocks[i];
  const cs=boardEl.clientWidth/N;
  const range=rangeOf(i);
  const axisPos=b.o==='H'?state.idxs[i][1]:state.idxs[i][0];
  drag={
    i,el,b,cs,
    horiz:b.o==='H',
    p0:b.o==='H'?e.clientX:e.clientY,
    basePx:(axisPos-1)*cs,
    minPx:(range.min-1)*cs,
    maxPx:(range.max-1)*cs,
    cur:(axisPos-1)*cs,
    lastPx:(axisPos-1)*cs,
    lastT:performance.now(),
    end:null,
    snapshot:state.idxs.map(x=>x.slice()),
  };
  el.classList.add('dragging');
  el.classList.remove('anim','anim-t');
  try{el.setPointerCapture(e.pointerId)}catch(err){}
  SFX.slideStart();SFX.tick();
  e.preventDefault();
});
blocksEl.addEventListener('pointermove',e=>{
  if(!drag)return;
  const d=drag;
  const p=d.horiz?e.clientX:e.clientY;
  let px=d.basePx+(p-d.p0);
  px=Math.max(d.minPx,Math.min(d.maxPx,px));
  /* 顶到端点：木块磕碰声 + 震动 */
  const end=px<=d.minPx?'min':px>=d.maxPx?'max':null;
  if(end&&d.end!==end){ SFX.knock(0.75); if(navigator.vibrate)navigator.vibrate(8); }
  d.end=end;
  d.cur=px;
  d.el.style.transform=d.horiz?'translateX('+(px-d.basePx)+'px)':'translateY('+(px-d.basePx)+'px)';
  const now=performance.now();
  const v=Math.abs(px-d.lastPx)/Math.max(1,now-d.lastT);
  SFX.slideSet(v);
  d.lastPx=px;d.lastT=now;
  e.preventDefault();
});
function endDrag(){
  if(!drag)return;
  const d=drag;drag=null;
  SFX.slideStop();
  const el=d.el;
  el.classList.remove('dragging');
  const snapped=Math.round(d.cur/d.cs);
  const lo=d.minPx/d.cs, hi=d.maxPx/d.cs;
  const cell=Math.max(lo,Math.min(hi,snapped)); /* 0-based 轴向位置 */
  const offset=cell*d.cs-d.basePx;
  const finish=()=>{
    if(el.classList.contains('exiting'))return; /* 已过关，交给滑出动画 */
    el.classList.remove('anim-t');
    el.style.transform='';
    if(d.horiz)el.style.left=(cell*d.cs)+'px';
    else el.style.top=(cell*d.cs)+'px';
  };
  el.classList.add('anim-t');
  el.style.transform=d.horiz?'translateX('+offset+'px)':'translateY('+offset+'px)';
  setTimeout(finish,160);
  /* 更新状态 */
  const oldIdx=d.snapshot[d.i];
  const newIdx=d.horiz?[oldIdx[0],cell+1]:[cell+1,oldIdx[1]];
  state.idxs[d.i]=newIdx;
  if(newIdx[0]!==oldIdx[0]||newIdx[1]!==oldIdx[1]){
    state.history.push(d.snapshot);
    state.moves++;
    $('moveCount').textContent=state.moves;
    $('undoBtn').disabled=false;
    SFX.thud();
    checkWin();
  }
}
blocksEl.addEventListener('pointerup',endDrag);
blocksEl.addEventListener('pointercancel',endDrag);
window.addEventListener('pointerup',endDrag);
/* 移动端禁止长按弹菜单/双击缩放干扰 */
boardEl.addEventListener('contextmenu',e=>e.preventDefault());
boardEl.addEventListener('dblclick',e=>e.preventDefault());

function checkWin(){
  const ti=state.blocks.findIndex(b=>b.target);
  if(state.idxs[ti][1]!==5)return;
  state.won=true;
  /* 目标块滑出出口动画：先无动画归位到最终格，再向右滑出并淡出 */
  const el=nodes[ti],cs=boardEl.clientWidth/N;
  el.classList.remove('anim-t','anim');
  el.style.transition='none';
  el.style.left=(4*cs)+'px';
  el.style.transform='';
  void el.offsetWidth;
  el.classList.add('exiting');
  el.style.transition=''; /* 清除内联 none，让 .exiting 的过渡生效 */
  el.style.transform='translateX('+(cs*1.6)+'px)';
  SFX.win();
  const m=state.moves,par=PAR[state.level-1]||m;
  const st=m<=par?3:(m<=par+4?2:1);
  stars[state.level]=Math.max(stars[state.level]||0,st);
  const prev=best[state.level];
  if(!prev||m<prev)best[state.level]=m;
  save();
  $('winStars').textContent='⭐'.repeat(st)+'☆'.repeat(3-st);
  $('winText').textContent='你用了 '+m+' 步完成本关（最优 '+par+' 步）'+(st===3?'，完美！':'');
  setTimeout(()=>$('winMask').classList.add('show'),620);
}

/* ===== 撤销 / 重置 / 提示 ===== */
$('undoBtn').onclick=()=>{
  if(state.won||!state.history.length)return;
  state.idxs=state.history.pop();
  state.moves=Math.max(0,state.moves-1);
  $('moveCount').textContent=state.moves;
  $('undoBtn').disabled=state.history.length===0;
  nodes.forEach(el=>el.classList.add('anim'));
  positionAll();
  setTimeout(()=>nodes.forEach(el=>el.classList.remove('anim')),170);
  SFX.tick();
};
$('resetBtn').onclick=()=>{loadLevel(state.level);SFX.tick();toast('本关已重置')};
$('hintBtn').onclick=()=>{
  if(state.won)return;
  const sol=solve(state.blocks,state.idxs);
  if(sol&&sol.length){
    const [i,ni]=sol[0];
    state.history.push(state.idxs.map(x=>x.slice()));
    state.idxs[i]=ni;state.moves++;
    $('moveCount').textContent=state.moves;$('undoBtn').disabled=false;
    const el=nodes[i];
    el.classList.add('anim','hintflash');
    positionAll();
    setTimeout(()=>el.classList.remove('anim','hintflash'),1700);
    SFX.thud();checkWin();
  }else toast('没有找到解法');
};

/* ===== BFS 求解器（用于提示） ===== */
function solve(blocks,startIdxs){
  const key=idxs=>idxs.map(x=>x[0]+','+x[1]).join('|');
  const isWin=idxs=>{const ti=blocks.findIndex(b=>b.target);return idxs[ti][1]===5};
  const start=startIdxs.map(x=>x.slice());
  if(isWin(start))return [];
  const q=[start],dist=new Map([[key(start),0]]),parent=new Map();
  let head=0,cnt=0;
  while(head<q.length&&cnt<400000){
    const st=q[head++];cnt++;
    const occSet=new Set();
    st.forEach((idx,i)=>cellsOf(blocks[i],idx).forEach(([r,c])=>occSet.add(r+','+c)));
    for(let i=0;i<blocks.length;i++){
      const b=blocks[i],idx=st[i];
      const occ=new Set(occSet);
      cellsOf(b,idx).forEach(([r,c])=>occ.delete(r+','+c));
      let lo,hi;
      if(b.o==='H'){
        lo=idx[1];hi=idx[1];
        while(lo>1&&!occ.has(idx[0]+','+(lo-1)))lo--;
        while(hi+b.len-1<N&&!occ.has(idx[0]+','+(hi+b.len)))hi++;
        for(let nc=lo;nc<=hi;nc++){
          if(nc===idx[1])continue;
          const ns=st.map(x=>x.slice());ns[i]=[idx[0],nc];
          const k=key(ns);
          if(dist.has(k))continue;
          dist.set(k,dist.get(key(st))+1);parent.set(k,{pk:key(st),i,ni:[idx[0],nc]});
          if(isWin(ns))return backtrack(k,parent);
          q.push(ns);
        }
      }else{
        lo=idx[0];hi=idx[0];
        while(lo>1&&!occ.has((lo-1)+','+idx[1]))lo--;
        while(hi+b.len-1<N&&!occ.has((hi+b.len)+','+idx[1]))hi++;
        for(let nr=lo;nr<=hi;nr++){
          if(nr===idx[0])continue;
          const ns=st.map(x=>x.slice());ns[i]=[nr,idx[1]];
          const k=key(ns);
          if(dist.has(k))continue;
          dist.set(k,dist.get(key(st))+1);parent.set(k,{pk:key(st),i,ni:[nr,idx[1]]});
          if(isWin(ns))return backtrack(k,parent);
          q.push(ns);
        }
      }
    }
  }
  return null;
}
function backtrack(k,parent){
  const path=[];let cur=k;
  while(parent.has(cur)){
    const p=parent.get(cur);
    path.push([p.i,p.ni]);cur=p.pk;
  }
  path.reverse();return path;
}

/* ===== UI 事件 ===== */
$('prevBtn').onclick=()=>{loadLevel(state.level-1);SFX.tick()};
$('nextBtn').onclick=()=>{loadLevel(state.level+1);SFX.tick()};
$('themeBtn').onclick=()=>{$('themePanel').classList.toggle('show');SFX.tick()};
$('soundBtn').onclick=()=>{
  soundOn=!soundOn;
  if(SFX.ensure())SFX.master.gain.value=soundOn?1:0;
  applyTheme();save();SFX.tick();
};
$('winRetry').onclick=()=>{$('winMask').classList.remove('show');loadLevel(state.level);SFX.tick()};
$('winNext').onclick=()=>{$('winMask').classList.remove('show');loadLevel(state.level<LEVELS.length?state.level+1:1);SFX.tick()};
$('gridsBtn').onclick=()=>{renderLvMenu();$('gridMask').classList.add('show');SFX.tick()};
$('gridClose').onclick=()=>$('gridMask').classList.remove('show');
function renderLvMenu(){
  const m=$('lvMenu');m.innerHTML='';
  LEVELS.forEach((_,i)=>{
    const b=document.createElement('button');
    const st=stars[i+1]||0;
    b.className='lv-cell'+(st?' done':'')+(i+1===state.level?' cur':'');
    b.innerHTML=(i+1)+(st?'<small>'+'★'.repeat(st)+'</small>':'<small>&nbsp;</small>');
    b.onclick=()=>{$('gridMask').classList.remove('show');loadLevel(i+1);SFX.tick()};
    m.appendChild(b);
  });
}
let toastTimer=null;
function toast(msg){
  const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1500);
}
document.addEventListener('pointerdown',e=>{
  if(!e.target.closest('#themePanel')&&!e.target.closest('#themeBtn'))$('themePanel').classList.remove('show');
});

/* ===== 初始化 ===== */
const isNew=!localStorage.getItem('slideUnlock.save.v2');
initGrain();loadSave();buildGrid();applyTheme();loadLevel(state.level);
$('levelTotal').textContent=LEVELS.length;
if(isNew)
  setTimeout(()=>toast('拖动木块，把红木块从右侧出口推出'),600);

/* 调试钩子（测试用） */
window.__game={state,loadLevel,solve,rangeOf,get nodes(){return nodes}};
</script>
